name: AUTORADAR Collector and Pages

on:
  workflow_dispatch:
    inputs:
      detail_budget:
        description: Detailed ads to refresh
        required: false
        default: "80"
  schedule:
    - cron: "3,18,33,48 * * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: autoradar-production
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Browser smoke test
        run: python scraper/smoke_test.py

      - name: Collect market data
        env:
          DETAIL_BUDGET: ${{ github.event.inputs.detail_budget || '35' }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scraper/run.py

      - name: Collector health check
        run: python scraper/health_check.py

      - name: Commit changed data
        run: |
          git config user.name "AUTORADAR Bot"
          git config user.email "autoradar-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: market refresh [collector]"
            git push
          else
            echo "No market changes to commit"
          fi

      - name: Build Pages artifact
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/current.json _site/data/
          cp data/history.json _site/data/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        uses: actions/deploy-pages@v4

  deploy_on_push:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Pages artifact
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/current.json _site/data/
          cp data/history.json _site/data/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
