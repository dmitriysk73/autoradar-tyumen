.github/workflows/autoradar.yml
      - name: Deploy Pages
        uses: actions/deploy-pages@v4

  deploy_on_push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v6
      - name: Build static site artifact
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/current.json _site/data/
          cp data/history.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
      - uses: actions/deploy-pages@v4
